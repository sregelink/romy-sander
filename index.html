<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL =
"https://lyunugxabsahoyywfqhc.supabase.co";

const SUPABASE_KEY =
"sb_publishable_BSDh9x32ocZYz8tfD87Jfg_-OJnL0X2";

const PASSWORD =
"mijngeheimecode";

const NEXT_PAGE =
"pagina2.html";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let visitorId =
localStorage.getItem("visitorId");

if (!visitorId) {
    visitorId = crypto.randomUUID();
    localStorage.setItem(
        "visitorId",
        visitorId
    );
}

async function logAttempt(password, success){

    await supabaseClient
    .from("password_logs")
    .insert({
        visitor_id: visitorId,
        password_entered: password,
        success: success
    });
}

async function getLockData(){

    const { data } =
    await supabaseClient
    .from("password_locks")
    .select("*")
    .eq("visitor_id", visitorId)
    .maybeSingle();

    return data;
}

async function handlePassword(){

    const message =
    document.getElementById("message");

    const entered =
    document
    .getElementById("passwordInput")
    .value
    .trim();

    const lockData =
    await getLockData();

    if(
        lockData &&
        lockData.locked_until &&
        new Date(lockData.locked_until) > new Date()
    ){

        const mins =
        Math.ceil(
            (
                new Date(lockData.locked_until)
                - new Date()
            ) / 60000
        );

        message.textContent =
        "Geblokkeerd. Nog " +
        mins +
        " minuten.";

        return;
    }

    if(entered === PASSWORD){

        await logAttempt(
            entered,
            true
        );

        window.location.href =
        NEXT_PAGE;

        return;
    }

    await logAttempt(
        entered,
        false
    );

    let attempts = 1;

    if(lockData){
        attempts =
        lockData.attempts + 1;
    }

    if(attempts >= 3){

        const lockUntil =
        new Date(
            Date.now() +
            12 * 60 * 60 * 1000
        ).toISOString();

        await supabaseClient
        .from("password_locks")
        .upsert({
            visitor_id: visitorId,
            attempts: attempts,
            locked_until: lockUntil
        });

        message.textContent =
        "3 foutieve pogingen. 12 uur geblokkeerd.";

        return;
    }

    await supabaseClient
    .from("password_locks")
    .upsert({
        visitor_id: visitorId,
        attempts: attempts
    });

    message.textContent =
    "Onjuist wachtwoord. Nog " +
    (3 - attempts) +
    " poging(en) over.";

    document
    .getElementById("passwordInput")
    .value = "";
}

document
.getElementById("passwordBtn")
.addEventListener(
    "click",
    handlePassword
);
</script>
